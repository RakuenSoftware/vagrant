# SPDX-License-Identifier: AGPL-3.0-only
name: Desktop player packages

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Archive version (letters, digits, dots and hyphens)
        default: development
        required: true
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUILD_VERSION: ${{ (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || inputs.version || (github.event_name == 'pull_request' && format('pr-{0}', github.event.number)) || (github.ref == 'refs/heads/main' && format('v0.1.0-preview.main.{0}', github.run_number)) || github.ref_name }}

jobs:
  player:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: windows-2022
            target: windows-x64
          - os: macos-15
            target: macos-universal
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.403'
      - name: Install Linux desktop runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon0 libxcursor1 libxinerama1 libxi6 libgl1 build-essential pkg-config
      - name: Install Windows media compiler
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make pkgconf diffutils mingw-w64-x86_64-gcc
      - name: Verify attached-rig projection with synthetic data
        shell: bash
        run: python tools/release.py "$TARGET" --verify-projection
      - name: Build, audit and verify the player using binary engine dependencies
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        shell: bash
        run: python tools/release.py "$TARGET" --version "$BUILD_VERSION"
      - name: Upload player archives only
        uses: actions/upload-artifact@v4
        with:
          name: ProjectVagrant-${{ matrix.target }}
          path: |
            dist/ProjectVagrant-*.zip
            dist/ProjectVagrant-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
  release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    needs: player
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true
      - name: Verify release archive checksums
        working-directory: release-dist
        run: sha256sum -c *.zip.sha256
      - name: Publish the verified preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_args=(--prerelease --title "Project Vagrant $BUILD_VERSION — unofficial runtime preview" --notes-file distribution/RELEASE-NOTES.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_args+=(--verify-tag)
          else
            release_args+=(--target "$GITHUB_SHA")
          fi
          gh release create "$BUILD_VERSION" release-dist/*.zip release-dist/*.zip.sha256 "${release_args[@]}"
